<div id="floating-window">
  <div
    id="window-header"
    class="bg-gray-800 text-white p-3 flex justify-between items-center"
  >
    <div>
      <h2 class="font-bold text-lg">UPA PO Copier</h2>
      <h6 class="font-bold text-lg">by Naguib Amged</h6>
    </div>
    <button id="close-window-btn" class="text-gray-400 hover:text-white">
      &times;
    </button>
  </div>

  <div class="p-4 space-y-4">
    <div class="flex items-center space-x-2">
      <button
        id="copy-table-btn"
        class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50"
      >
        نسخ جدول أمر التوريد
      </button>
      <button
        id="copy-table-header-btn"
        class="w-full bg-purple-500 hover:bg-purple-600 text-white font-bold py-2 px-4 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-opacity-50"
      >
        بالعناوين
      </button>
      <div
        id="status-box-1"
        class="status-box text-xs font-semibold px-3 py-1 rounded-full whitespace-nowrap bg-gray-200 text-gray-700"
      >
        Idle
      </div>
    </div>

    <div class="flex items-center space-x-2">
      <button
        id="placeholder-btn"
        class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-opacity-50"
      >
        نسخ جدول السلة
      </button>
      <button
        id="placeholder-header-btn"
        class="w-full bg-purple-500 hover:bg-purple-600 text-white font-bold py-2 px-4 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-opacity-50"
      >
        بالعناوين
      </button>
      <div
        id="status-box-2"
        class="status-box text-xs font-semibold px-3 py-1 rounded-full whitespace-nowrap bg-gray-200 text-gray-700"
      >
        Idle
      </div>
    </div>

    <div>
      <textarea
        id="full-order-input"
        rows="3"
        placeholder="رقم في كل سطر"
        autocomplete="off"
      ></textarea>
      <div class="flex items-center space-x-2">
        <button
          id="copy-full-order-btn"
          class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-2 px-4 rounded-md focus:outline-none focus:ring-2 focus:ring-amber-500 focus:ring-opacity-50"
        >
          نسخ أمر التوريد بالكامل
        </button>
        <button id="copy-full-order-header-btn" type="button">بالعناوين</button>
        <div
          id="status-box-3"
          class="status-box text-xs font-semibold px-3 py-1 rounded-full whitespace-nowrap bg-gray-200 text-gray-700"
        >
          Idle
        </div>
      </div>
      <div class="flex items-center space-x-2 full-order-controls">
        <button id="pause-full-order-btn" type="button" disabled>إيقاف مؤقت</button>
        <button id="stop-full-order-btn" type="button" disabled>إيقاف</button>
      </div>
    </div>
  </div>
</div>
